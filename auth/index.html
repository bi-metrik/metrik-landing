<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>MéTRIK · Acceso a tableros</title>
<link rel="icon" type="image/png" href="/assets/marca/metrik-isotipo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Martian+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --carbon: #191713;
  --gris: #6E6A62;
  --pino: #0E5C43;
  --pino-300: #6FB89D;
  --pino-300-rgb: 111, 184, 157;
  --oxido: #B3382C;
  --blanco: #FFFFFF;
  --gris-linea: #E3E0D9;
  --papel: #F3F1EC;
  --font: 'Schibsted Grotesk', sans-serif;
  --s-xs: 0.5rem;
  --s-sm: 1rem;
  --s-md: 1.5rem;
  --s-lg: 2.5rem;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--carbon);
  color: var(--gris);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: var(--s-md);
  -webkit-font-smoothing: antialiased;
}
.shell { width: 100%; max-width: 420px; }

/* Encabezado: sobre carbon el verde sube a Pino 300 */
.head { text-align: center; margin-bottom: var(--s-lg); }
.head img { height: 34px; width: auto; }
.head p {
  margin-top: var(--s-sm);
  font-size: 0.6875rem; font-weight: 700;
  letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--pino-300);
}

.card {
  background: var(--papel);
  border-radius: 4px;
  padding: var(--s-lg) var(--s-md);
  border-top: 3px solid var(--pino);
}
.card h1 {
  font-size: 1.375rem; font-weight: 700; letter-spacing: -0.02em;
  color: var(--carbon); margin-bottom: var(--s-xs);
}
.card-sub { font-size: 0.875rem; color: var(--gris); margin-bottom: var(--s-lg); }

.campo { margin-bottom: var(--s-md); }
.campo label {
  display: block; margin-bottom: var(--s-xs);
  font-size: 0.6875rem; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--carbon);
}
.campo select, .campo input[type="password"] {
  width: 100%; padding: 0.75rem var(--s-sm);
  font-family: var(--font); font-size: 0.9375rem; color: var(--carbon);
  background: var(--blanco);
  border: 1px solid var(--gris-linea); border-radius: 3px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.campo select:focus, .campo input[type="password"]:focus {
  outline: none; border-color: var(--pino);
  box-shadow: 0 0 0 3px rgba(var(--pino-300-rgb), 0.35);
}
.campo input::placeholder { color: #6E6A62; }

.recordar { display: flex; align-items: center; gap: var(--s-xs); margin-bottom: var(--s-lg); }
.recordar input { width: 15px; height: 15px; accent-color: var(--pino); }
.recordar label { font-size: 0.8125rem; color: var(--gris); }

button {
  width: 100%; padding: 0.875rem var(--s-sm);
  font-family: var(--font); font-size: 0.9375rem; font-weight: 700;
  letter-spacing: 0.01em;
  color: var(--blanco); background: var(--pino);
  border: none; border-radius: 3px; cursor: pointer;
  transition: background 0.2s;
}
button:hover { background: #0A4634; }

.aviso {
  margin-top: var(--s-md); padding: 0.75rem var(--s-sm);
  font-size: 0.8125rem; border-radius: 3px;
}
.aviso--error {
  color: var(--oxido); background: rgba(179, 56, 44, 0.08);
  border: 1px solid rgba(179, 56, 44, 0.25);
}
.aviso--nota {
  color: var(--gris); background: rgba(110, 106, 98, 0.07);
  border: 1px solid var(--gris-linea);
}
[hidden] { display: none !important; }

.pie {
  margin-top: var(--s-md); text-align: center;
  font-size: 0.75rem; color: #A19C92;   /* sobre carbon el gris sube: #6E6A62 no se lee */
}
</style>
</head>
<body>

<div class="shell">
  <div class="head">
    <img src="/assets/marca/metrik-wordmark-negativo.svg" alt="MéTRIK">
    <p>Tableros operacionales</p>
  </div>

  <div class="card">
    <h1>Ingresa a tu tablero</h1>
    <p class="card-sub">Selecciona tu empresa y escribe la clave que te compartimos.</p>

    <form id="authForm">
      <div class="campo">
        <label for="clientSelect">Empresa</label>
        <select id="clientSelect" required>
          <option value="">Selecciona tu empresa</option>
          <option value="creadores">Creadores de Prosperidad</option>
        </select>
      </div>

      <div class="campo">
        <label for="passwordInput">Clave</label>
        <input type="password" id="passwordInput" placeholder="Escribe tu clave" required>
      </div>

      <div class="recordar">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Recuérdame en este dispositivo</label>
      </div>

      <button type="submit">Entrar al tablero</button>
    </form>

    <div id="errorMsg" class="aviso aviso--error" hidden><span id="errorText"></span></div>

    <div class="aviso aviso--nota">
      Si no tienes acceso, escríbele a tu contacto en MéTRIK.
    </div>
  </div>

  <p class="pie">&copy; 2026 MéTRIK · Tableros operacionales</p>
</div>

<script>
const CLIENTS = {
  'creadores': {
    name: 'Creadores de Prosperidad',
    password: 'CreadoresOps2025!',
    url: 'https://metrik360.github.io/creadores-de-prosperidad-dashboard/'
  }
};

document.getElementById('authForm').addEventListener('submit', (event) => {
  event.preventDefault();

  const clientKey = document.getElementById('clientSelect').value;
  const password = document.getElementById('passwordInput').value;
  const errorMsg = document.getElementById('errorMsg');
  const errorText = document.getElementById('errorText');
  const cliente = CLIENTS[clientKey];

  if (!cliente || cliente.password !== password) {
    errorText.textContent = 'Empresa o clave incorrecta.';
    errorMsg.hidden = false;
    return;
  }

  errorMsg.hidden = true;

  if (document.getElementById('rememberMe').checked) {
    localStorage.setItem('metrik_client', clientKey);
  }

  window.location.href = cliente.url;
});

window.addEventListener('load', () => {
  const savedClient = localStorage.getItem('metrik_client');
  if (savedClient && CLIENTS[savedClient]) {
    document.getElementById('clientSelect').value = savedClient;
  }
});
</script>

</body>
</html>
